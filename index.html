<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b17">
    <meta name="description" content="Random Year 7 science flashcards. Pick a topic, test yourself, and reveal the answer when you're ready.">
    <title>Year 7 Science Flashcards</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #070b17;
        --panel: #0c1222;
        --card: #111a2e;
        --text: #effaff;
        --muted: #9cacc6;
        --cyan: #38f2df;
        --pink: #ff50d8;
        --lime: #d7ff70;
        --topic-glow: var(--cyan);
        --topic-glow-soft: rgb(56 242 223 / 14%);
        --topic-glow-mid: rgb(56 242 223 / 52%);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: var(--background);
        color: var(--text);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(rgb(56 242 223 / 10%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 80 216 / 8%) 1px, transparent 1px),
          radial-gradient(ellipse at 8% 8%, rgb(107 49 255 / 48%), transparent 35rem),
          radial-gradient(ellipse at 86% 20%, rgb(255 42 204 / 24%), transparent 31rem),
          radial-gradient(ellipse at 94% 82%, rgb(9 210 235 / 26%), transparent 34rem),
          var(--background);
        background-size: 30px 30px, 30px 30px, auto, auto, auto, auto;
      }

      body::before {
        position: fixed;
        z-index: 0;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 3px,
          rgb(255 255 255 / 5%) 4px
        );
        content: "";
        pointer-events: none;
      }

      button,
      select {
        font: inherit;
      }

      button:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 3px;
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(100% - 2rem, 940px);
        margin: 0 auto;
        padding: 2rem 0 3rem;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        color: var(--cyan);
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-shadow: 0 0 14px rgb(56 242 223 / 30%);
      }

      .brand-mark {
        display: grid;
        width: 2.4rem;
        height: 2.4rem;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 55%);
        border-radius: 0.65rem;
        background: linear-gradient(140deg, var(--cyan), #8a72ff 58%, var(--pink));
        box-shadow: 0 0 18px rgb(56 242 223 / 35%);
        color: #07121d;
        font-size: 1.25rem;
      }

      .year-tag {
        padding: 0.45rem 0.75rem;
        border: 1px solid rgb(56 242 223 / 45%);
        border-radius: 999px;
        background: rgb(56 242 223 / 7%);
        color: var(--cyan);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .test-link {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0.65rem 0.95rem;
        border: 1px solid rgb(255 80 216 / 52%);
        border-radius: 999px;
        background: rgb(255 80 216 / 9%);
        box-shadow: 0 0 16px rgb(255 80 216 / 12%);
        color: #ff91e4;
        font-size: 0.82rem;
        font-weight: 800;
        text-decoration: none;
      }

      .test-link:hover {
        background: rgb(255 80 216 / 16%);
      }

      .test-link:focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 3px;
      }

      .intro {
        padding: clamp(2.5rem, 7vw, 5rem) 0 2rem;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.8rem;
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.17em;
        text-shadow: 0 0 14px rgb(56 242 223 / 45%);
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.7rem, 8vw, 5.2rem);
        letter-spacing: -0.065em;
        line-height: 1;
      }

      h1 span {
        color: var(--pink);
        text-shadow: 0 0 24px rgb(255 80 216 / 32%);
      }

      .subtitle {
        max-width: 35rem;
        margin: 1.2rem auto 0;
        color: #b7c5df;
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.6;
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 1rem;
        margin: 0 auto 1rem;
        padding: 0.9rem 1rem;
        border: 1px solid rgb(56 242 223 / 18%);
        border-radius: 1rem;
        background: rgb(12 18 34 / 82%);
        box-shadow: inset 0 1px rgb(255 255 255 / 4%);
        backdrop-filter: blur(12px);
      }

      .topic-filter {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.6rem;
      }

      .filter-label {
        flex: none;
        color: #b7c5df;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .topic-options {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .topic-chip {
        position: relative;
      }

      .topic-chip input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .topic-chip span {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0.55rem 0.75rem;
        border: 1px solid #344463;
        border-radius: 999px;
        background: #111a2e;
        color: #b7c5df;
        font-size: 0.78rem;
        font-weight: 800;
        cursor: pointer;
        transition: border-color 140ms ease, background 140ms ease, color 140ms ease, box-shadow 140ms ease;
      }

      .topic-chip input:checked + span {
        border-color: var(--cyan);
        background: rgb(56 242 223 / 12%);
        box-shadow: 0 0 14px rgb(56 242 223 / 16%);
        color: var(--text);
      }

      .topic-chip input:focus-visible + span {
        outline: 3px solid var(--lime);
        outline-offset: 3px;
      }

      .topic-actions {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.4rem;
      }

      .topic-action {
        min-height: 44px;
        padding: 0.55rem 0.75rem;
        border: 1px solid #344463;
        border-radius: 999px;
        background: transparent;
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 800;
        cursor: pointer;
      }

      .topic-action:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .count {
        grid-column: 2;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: right;
      }

      .flashcard {
        position: relative;
        overflow: hidden;
        min-height: 350px;
        padding: clamp(1.5rem, 6vw, 3.5rem);
        border: 1px solid var(--topic-glow-mid);
        border-radius: 1.25rem 1.65rem 1.25rem 1.65rem;
        background:
          radial-gradient(ellipse at 98% 4%, var(--topic-glow-soft), transparent 32rem),
          linear-gradient(145deg, rgb(20 30 52 / 97%), rgb(10 15 29 / 98%));
        box-shadow:
          0 0 0 1px var(--topic-glow-soft),
          0 0 34px var(--topic-glow-soft),
          0 0 70px var(--topic-glow-soft),
          0 26px 70px rgb(3 5 20 / 55%);
        color: var(--text);
      }

      .flashcard::after {
        position: absolute;
        right: -3.2rem;
        bottom: -5.2rem;
        width: 12rem;
        height: 12rem;
        border: 1.6rem solid var(--topic-glow-soft);
        border-radius: 50%;
        content: "";
        pointer-events: none;
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .topic {
        display: inline-flex;
        padding: 0.5rem 0.85rem;
        border: 1px solid var(--topic-glow-mid);
        border-radius: 0.55rem 999px 999px;
        background: var(--topic-glow-soft);
        box-shadow: 0 0 16px var(--topic-glow-soft);
        color: var(--topic-glow);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .card-hint {
        color: var(--topic-glow);
        font-size: 0.85rem;
        font-weight: 700;
      }

      .question-area {
        display: grid;
        min-height: 190px;
        align-content: center;
        padding: 1.7rem 0;
      }

      .question {
        max-width: 42rem;
        margin: 0;
        color: #f4fbff;
        font-size: clamp(1.7rem, 5vw, 2.7rem);
        letter-spacing: -0.035em;
        line-height: 1.2;
        text-shadow: 0 0 22px var(--topic-glow-soft);
      }

      .answer {
        margin-top: 1.3rem;
        padding: 1rem 1.15rem;
        border: 1px solid var(--topic-glow-mid);
        border-left: 4px solid var(--topic-glow);
        border-radius: 0 0.8rem 0.8rem 0;
        background: linear-gradient(100deg, var(--topic-glow-soft), rgb(11 17 31 / 88%));
        color: #effaff;
        font-size: 1.05rem;
        line-height: 1.6;
        white-space: pre-line;
      }

      .answer[hidden] {
        display: none;
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .button {
        min-height: 2.9rem;
        padding: 0.75rem 1.15rem;
        border: 0;
        border-radius: 0.8rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 140ms ease, filter 140ms ease;
      }

      .button:hover:not(:disabled) {
        filter: brightness(1.05);
        transform: translateY(-2px);
      }

      .button:disabled {
        cursor: default;
        opacity: 0.68;
      }

      .button-primary {
        background: var(--topic-glow);
        color: #07151b;
        box-shadow: 0 0 20px var(--topic-glow-mid);
      }

      .button-secondary {
        border: 1px solid var(--topic-glow-mid);
        background: rgb(12 18 34 / 60%);
        color: var(--topic-glow);
      }

      .message {
        margin: 1.5rem 0 0;
        color: #ff9ee9;
        text-align: center;
      }

      .study-note {
        margin: 1.3rem 0 0;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.5;
        text-align: center;
      }

      @media (max-width: 900px) {
        .page {
          width: min(100% - 3rem, 800px);
          padding: 1.5rem 0 2rem;
        }

        .intro {
          padding: 2rem 0 1.25rem;
        }

        h1 {
          font-size: clamp(2.6rem, 6vw, 4rem);
        }

        .subtitle {
          margin-top: 0.8rem;
          font-size: 1rem;
          line-height: 1.45;
        }

        .controls {
          padding: 0.7rem 0.85rem;
        }

        .flashcard {
          min-height: 320px;
          padding: clamp(1.4rem, 4vw, 2.4rem);
          border-radius: 1.4rem;
        }

        .question-area {
          min-height: 150px;
          padding: 1rem 0;
        }

        .question {
          font-size: clamp(1.55rem, 4vw, 2.2rem);
        }
      }

      @media (max-width: 540px) {
        .page {
          width: min(100% - 1rem, 940px);
          padding: 0.8rem 0 1.25rem;
        }

        .brand {
          gap: 0.5rem;
          font-size: 0.82rem;
        }

        .brand-mark {
          width: 2.1rem;
          height: 2.1rem;
        }

        .intro {
          padding: 1.4rem 0 0.9rem;
        }

        .eyebrow {
          margin-bottom: 0.45rem;
          font-size: 0.7rem;
          letter-spacing: 0.13em;
        }

        h1 {
          font-size: clamp(2.15rem, 9.5vw, 2.8rem);
          line-height: 1.02;
        }

        .subtitle {
          margin-top: 0.65rem;
          font-size: clamp(0.92rem, 3.8vw, 1rem);
          line-height: 1.4;
        }

        .controls {
          grid-template-columns: 1fr;
          align-items: flex-start;
          gap: 0.45rem;
          margin-bottom: 0.65rem;
          padding: 0.55rem 0.7rem;
          border-radius: 0.8rem;
        }

        .topic-filter {
          width: 100%;
          align-items: flex-start;
          flex-direction: column;
        }

        .filter-label {
          font-size: 0.85rem;
        }

        .topic-options {
          width: 100%;
        }

        .topic-chip span {
          min-height: 44px;
          padding: 0.5rem 0.65rem;
        }

        .count {
          grid-column: 1;
          text-align: left;
          font-size: 0.78rem;
        }

        .flashcard {
          min-height: 300px;
          padding: 1.1rem;
          border-radius: 1.1rem;
        }

        .topic {
          padding: 0.4rem 0.7rem;
          font-size: 0.72rem;
        }

        .card-hint {
          max-width: 6rem;
          font-size: 0.76rem;
          text-align: right;
        }

        .question-area {
          min-height: 125px;
          padding: 0.9rem 0;
        }

        .question {
          font-size: clamp(1.45rem, 6.8vw, 1.9rem);
          line-height: 1.22;
        }

        .answer {
          margin-top: 0.85rem;
          padding: 0.75rem 0.85rem;
          font-size: 0.96rem;
          line-height: 1.5;
        }

        .card-actions {
          gap: 0.55rem;
        }

        .button {
          min-height: 44px;
          padding: 0.65rem 0.9rem;
          font-size: 0.92rem;
        }

        .study-note {
          margin-top: 0.8rem;
          font-size: 0.8rem;
        }
      }

      @media (min-width: 541px) and (max-width: 1200px) and (min-height: 501px) and (max-height: 820px) and (orientation: landscape) {
        .page {
          padding: 0.75rem 0 1rem;
        }

        .intro {
          padding: 0.8rem 0 0.65rem;
        }

        h1 {
          font-size: clamp(2.3rem, 4.4vw, 3rem);
        }

        .subtitle {
          margin-top: 0.5rem;
          font-size: 0.95rem;
        }

        .controls {
          margin-bottom: 0.6rem;
          padding: 0.55rem 0.75rem;
        }

        .flashcard {
          min-height: 0;
          padding: 1.3rem 1.6rem;
          border-radius: 1.25rem;
        }

        .question-area {
          min-height: 130px;
          padding: 0.75rem 0;
        }

        .question {
          font-size: clamp(1.6rem, 3vw, 2.1rem);
        }

        .study-note {
          margin-top: 0.75rem;
        }
      }

      @media (max-height: 500px) and (orientation: landscape) {
        .page {
          width: min(100% - 2rem, 1000px);
          padding: 0.5rem 0 0.45rem;
        }

        .brand-mark {
          width: 1.8rem;
          height: 1.8rem;
        }

        .intro {
          padding: 0.45rem 0 0.55rem;
        }

        .eyebrow {
          display: none;
        }

        h1 {
          font-size: clamp(1.55rem, 4vw, 2.4rem);
        }

        .subtitle {
          margin-top: 0.3rem;
          font-size: 0.85rem;
          line-height: 1.35;
        }

        .controls {
          margin-bottom: 0.5rem;
          padding: 0.45rem 0.7rem;
        }

        .flashcard {
          min-height: 0;
          padding: 0.9rem 1.1rem;
          border-radius: 1.1rem;
        }

        .question-area {
          min-height: 95px;
          padding: 0.55rem 0;
        }

        .question {
          font-size: clamp(1.4rem, 3vw, 2rem);
        }

        .answer {
          margin-top: 0.55rem;
          padding: 0.6rem 0.8rem;
        }

        .card-actions {
          gap: 0.55rem;
        }

        .button {
          min-height: 44px;
          padding: 0.6rem 0.9rem;
        }

        .study-note {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topline">
        <span class="year-tag">YEAR 7</span>
        <a class="test-link" href="./test.html">Take a Test</a>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Little cards. Big brain energy.</p>
        <h1 id="page-title">Ready, set, <span>science!</span></h1>
      </section>

      <section class="controls" aria-label="Flashcard controls">
        <div class="topic-filter">
          <span class="filter-label">Topics</span>
          <div id="topic-options" class="topic-options" aria-label="Choose one or more topics"></div>
        </div>
        <div class="topic-actions" aria-label="Topic selection controls">
          <button id="all-topics" class="topic-action" type="button" disabled>All</button>
          <button id="none-topics" class="topic-action" type="button" disabled>None</button>
        </div>
        <span id="card-count" class="count" aria-live="polite">Loading your cards…</span>
      </section>

      <article class="flashcard" aria-labelledby="question">
        <div class="card-top">
          <span id="topic-badge" class="topic">Getting ready…</span>
          <span class="card-hint">Think it through ✨</span>
        </div>
        <div class="question-area">
          <h2 id="question" class="question">Loading your science cards…</h2>
          <div id="answer" class="answer" role="status" aria-live="polite" hidden></div>
        </div>
        <div class="card-actions">
          <button id="reveal-button" class="button button-primary" type="button" aria-pressed="false" aria-expanded="false" aria-controls="answer" disabled>Reveal answer</button>
          <button id="next-button" class="button button-secondary" type="button" disabled>Next random card ↗</button>
        </div>
      </article>
      <p id="error-message" class="message" role="alert" hidden></p>
      <p class="study-note">No scores, no pressure — just one small science win at a time.</p>
    </main>

    <script>
      const questionElement = document.querySelector("#question");
      const answerElement = document.querySelector("#answer");
      const topicBadge = document.querySelector("#topic-badge");
      const topicOptions = document.querySelector("#topic-options");
      const allTopicsButton = document.querySelector("#all-topics");
      const noneTopicsButton = document.querySelector("#none-topics");
      const cardCount = document.querySelector("#card-count");
      const revealButton = document.querySelector("#reveal-button");
      const nextButton = document.querySelector("#next-button");
      const errorMessage = document.querySelector("#error-message");
      const flashcard = document.querySelector(".flashcard");

      let questions = [];
      let currentQuestion = null;
      let cardBag = [];
      let bagTopicKey = "";
      const selectedTopics = new Set();
      const topicGlows = {
        "Skills": ["#ff59d6", "rgb(255 89 214 / 14%)", "rgb(255 89 214 / 52%)"],
        "Organisation": ["#bd86ff", "rgb(189 134 255 / 14%)", "rgb(189 134 255 / 52%)"],
        "Atoms": ["#55aaff", "rgb(85 170 255 / 14%)", "rgb(85 170 255 / 52%)"],
        "Biological Systems": ["#49ffb0", "rgb(73 255 176 / 14%)", "rgb(73 255 176 / 52%)"],
        "Solutions, Compounds and Mixtures": ["#e6ff5e", "rgb(230 255 94 / 14%)", "rgb(230 255 94 / 52%)"],
        "Astronomy": ["#9282ff", "rgb(146 130 255 / 14%)", "rgb(146 130 255 / 52%)"],
        "Energy": ["#ffb347", "rgb(255 179 71 / 14%)", "rgb(255 179 71 / 52%)"],
        "Ecology and Feeding": ["#75f05c", "rgb(117 240 92 / 14%)", "rgb(117 240 92 / 52%)"],
        "Acids and Alkalis": ["#ff6d7f", "rgb(255 109 127 / 14%)", "rgb(255 109 127 / 52%)"],
        "Electromagnetism": ["#44e8ff", "rgb(68 232 255 / 14%)", "rgb(68 232 255 / 52%)"]
      };
      const defaultGlow = ["#38f2df", "rgb(56 242 223 / 14%)", "rgb(56 242 223 / 52%)"];

      function filteredQuestions() {
        if (selectedTopics.size === 0) return [];
        return questions.filter((item) => selectedTopics.has(item.topic));
      }

      function selectedTopicKey() {
        return [...selectedTopics].sort().join("\u001f");
      }

      function shuffle(items) {
        const shuffled = [...items];
        for (let index = shuffled.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
        }
        return shuffled;
      }

      function rebuildBag() {
        const available = filteredQuestions();
        cardBag = shuffle(available);
        bagTopicKey = selectedTopicKey();

        if (cardBag.length > 1 && currentQuestion &&
          cardBag[cardBag.length - 1] === currentQuestion) {
          [cardBag[0], cardBag[cardBag.length - 1]] =
            [cardBag[cardBag.length - 1], cardBag[0]];
        }
      }

      function updateCount(eligibleCount) {
        if (eligibleCount === 0) {
          cardCount.textContent = "0 cards selected";
          return;
        }
        const cardLabel = eligibleCount === 1 ? "card" : "cards";
        const remainingLabel = cardBag.length === 1 ? "card" : "cards";
        cardCount.textContent =
          `${eligibleCount} eligible ${cardLabel} · ${cardBag.length} ${remainingLabel} left`;
      }

      function showRandomQuestion() {
        const available = filteredQuestions();
        updateCount(available.length);
        if (available.length === 0) {
          cardBag = [];
          bagTopicKey = selectedTopicKey();
          currentQuestion = null;
          questionElement.textContent = "Choose at least one topic.";
          topicBadge.textContent = "No topics selected";
          answerElement.textContent = "";
          answerElement.hidden = true;
          revealButton.disabled = true;
          revealButton.textContent = "Reveal answer";
          revealButton.setAttribute("aria-pressed", "false");
          revealButton.setAttribute("aria-expanded", "false");
          nextButton.disabled = true;
          flashcard.style.setProperty("--topic-glow", defaultGlow[0]);
          flashcard.style.setProperty("--topic-glow-soft", defaultGlow[1]);
          flashcard.style.setProperty("--topic-glow-mid", defaultGlow[2]);
          return;
        }

        nextButton.disabled = false;
        if (bagTopicKey !== selectedTopicKey() || cardBag.length === 0) {
          rebuildBag();
        }

        currentQuestion = cardBag.pop();
        updateCount(available.length);
        questionElement.textContent = currentQuestion.question;
        topicBadge.textContent = currentQuestion.topic;
        const [glow, glowSoft, glowMid] = topicGlows[currentQuestion.topic] || defaultGlow;
        flashcard.style.setProperty("--topic-glow", glow);
        flashcard.style.setProperty("--topic-glow-soft", glowSoft);
        flashcard.style.setProperty("--topic-glow-mid", glowMid);
        answerElement.textContent = currentQuestion.answer;
        answerElement.hidden = true;
        revealButton.disabled = false;
        revealButton.textContent = "Reveal answer";
        revealButton.setAttribute("aria-pressed", "false");
        revealButton.setAttribute("aria-expanded", "false");
      }

      async function loadQuestions() {
        try {
          const response = await fetch("./questions.json");
          if (!response.ok) {
            throw new Error(`The question bank could not be loaded (${response.status}).`);
          }

          const data = await response.json();
          if (!Array.isArray(data) || data.length === 0 || data.some((item) =>
            !item || typeof item.topic !== "string" ||
            typeof item.question !== "string" || typeof item.answer !== "string"
          )) {
            throw new Error("The question bank is empty or has an invalid format.");
          }

          questions = data;
          const topics = [...new Set(questions.map((item) => item.topic))].sort();
          for (const topic of topics) {
            const label = document.createElement("label");
            label.className = "topic-chip";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = topic;
            checkbox.checked = true;
            checkbox.addEventListener("change", () => {
              if (checkbox.checked) selectedTopics.add(topic);
              else selectedTopics.delete(topic);
              rebuildBag();
              showRandomQuestion();
            });

            const text = document.createElement("span");
            text.textContent = topic;
            label.append(checkbox, text);
            topicOptions.append(label);
            selectedTopics.add(topic);
          }
          allTopicsButton.disabled = false;
          noneTopicsButton.disabled = false;
          nextButton.disabled = false;
          rebuildBag();
          showRandomQuestion();
        } catch (error) {
          questionElement.textContent = "Oops! The science cards couldn't load.";
          topicBadge.textContent = "Card deck offline";
          cardCount.textContent = "Try refreshing the page";
          errorMessage.textContent = error.message;
          errorMessage.hidden = false;
        }
      }

      revealButton.addEventListener("click", () => {
        if (!currentQuestion) return;
        const revealing = answerElement.hidden;
        answerElement.hidden = !revealing;
        revealButton.textContent = revealing ? "Hide answer" : "Reveal answer";
        revealButton.setAttribute("aria-pressed", String(revealing));
        revealButton.setAttribute("aria-expanded", String(revealing));
      });

      nextButton.addEventListener("click", showRandomQuestion);

      allTopicsButton.addEventListener("click", () => {
        const checkboxes = topicOptions.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((checkbox) => {
          checkbox.checked = true;
          selectedTopics.add(checkbox.value);
        });
        rebuildBag();
        showRandomQuestion();
      });

      noneTopicsButton.addEventListener("click", () => {
        const checkboxes = topicOptions.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((checkbox) => {
          checkbox.checked = false;
        });
        selectedTopics.clear();
        rebuildBag();
        showRandomQuestion();
      });

      loadQuestions();
    </script>
  </body>
</html>
