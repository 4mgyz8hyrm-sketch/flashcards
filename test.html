<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b17">
    <title>Year 7 Science Test</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #070b17;
        --panel: #0c1222;
        --text: #effaff;
        --muted: #9cacc6;
        --cyan: #38f2df;
        --pink: #ff50d8;
        --lime: #d7ff70;
        --topic-glow: #38f2df;
        --topic-glow-soft: rgb(56 242 223 / 14%);
        --topic-glow-mid: rgb(56 242 223 / 52%);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: var(--background);
        color: var(--text);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(rgb(56 242 223 / 10%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 80 216 / 8%) 1px, transparent 1px),
          radial-gradient(ellipse at 8% 8%, rgb(107 49 255 / 48%), transparent 35rem),
          radial-gradient(ellipse at 86% 20%, rgb(255 42 204 / 24%), transparent 31rem),
          var(--background);
        background-size: 30px 30px, 30px 30px, auto, auto, auto;
      }

      button, input { font: inherit; }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 3px;
      }

      .page {
        position: relative;
        width: min(100% - 2rem, 940px);
        margin: 0 auto;
        padding: 1.5rem 0 3rem;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .year-tag,
      .back-link {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .year-tag {
        padding: 0.45rem 0.75rem;
        border: 1px solid rgb(56 242 223 / 45%);
        background: rgb(56 242 223 / 7%);
        color: var(--cyan);
        letter-spacing: 0.08em;
      }

      .back-link {
        padding: 0.65rem 0.95rem;
        border: 1px solid rgb(56 242 223 / 45%);
        background: rgb(56 242 223 / 7%);
        color: var(--cyan);
        text-decoration: none;
      }

      .intro {
        padding: 2rem 0 1.25rem;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.55rem;
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 7vw, 4.8rem);
        letter-spacing: -0.055em;
        line-height: 1;
      }

      h1 span {
        color: var(--pink);
        text-shadow: 0 0 24px rgb(255 80 216 / 32%);
      }

      .subtitle {
        max-width: 38rem;
        margin: 0.8rem auto 0;
        color: #b7c5df;
        line-height: 1.5;
      }

      .controls,
      .test-card,
      .result-card {
        border: 1px solid rgb(56 242 223 / 18%);
        background: rgb(12 18 34 / 88%);
        box-shadow: inset 0 1px rgb(255 255 255 / 4%), 0 20px 55px rgb(3 5 20 / 35%);
        backdrop-filter: blur(12px);
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.8rem 1rem;
        margin-bottom: 1rem;
        padding: 0.85rem 1rem;
        border-radius: 1rem;
      }

      .topic-filter {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.6rem;
      }

      .filter-label {
        flex: none;
        color: #b7c5df;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .topic-options {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .topic-chip {
        position: relative;
      }

      .topic-chip input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .topic-chip span {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0.55rem 0.75rem;
        border: 1px solid #344463;
        border-radius: 999px;
        background: #111a2e;
        color: #b7c5df;
        font-size: 0.78rem;
        font-weight: 800;
        cursor: pointer;
      }

      .topic-chip input:checked + span {
        border-color: var(--cyan);
        background: rgb(56 242 223 / 12%);
        color: var(--text);
        box-shadow: 0 0 14px rgb(56 242 223 / 16%);
      }

      .topic-chip input:focus-visible + span,
      .choice input:focus-visible + span {
        outline: 3px solid var(--lime);
        outline-offset: 3px;
      }

      .topic-actions {
        display: flex;
        gap: 0.4rem;
      }

      .topic-action,
      .button {
        min-height: 44px;
        border-radius: 999px;
        font-weight: 800;
        cursor: pointer;
      }

      .topic-action {
        padding: 0.55rem 0.75rem;
        border: 1px solid #344463;
        background: transparent;
        color: var(--cyan);
        font-size: 0.78rem;
      }

      .button {
        padding: 0.7rem 1.1rem;
        border: 0;
        background: var(--cyan);
        box-shadow: 0 0 20px rgb(56 242 223 / 25%);
        color: #07151b;
      }

      .button-secondary {
        border: 1px solid rgb(255 80 216 / 45%);
        background: rgb(255 80 216 / 8%);
        box-shadow: none;
        color: #ff91e4;
      }

      .button:disabled,
      .topic-action:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .control-footer {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .test-card {
        margin-top: 1rem;
        padding: 1.2rem;
        border-radius: 1.25rem;
      }

      .test-card[hidden],
      .result-card[hidden] { display: none; }

      .question-list {
        display: grid;
        gap: 1rem;
      }

      .question-block {
        padding: 1rem;
        border: 1px solid rgb(56 242 223 / 16%);
        border-radius: 1rem;
        background: linear-gradient(145deg, rgb(20 30 52 / 80%), rgb(10 15 29 / 90%));
      }

      .question-block legend {
        max-width: 100%;
        margin-bottom: 0.85rem;
        color: var(--text);
        font-size: clamp(1.05rem, 3vw, 1.35rem);
        font-weight: 800;
        line-height: 1.35;
      }

      .question-topic {
        display: block;
        margin-bottom: 0.45rem;
        color: var(--cyan);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .choices {
        display: grid;
        gap: 0.55rem;
      }

      .choice {
        position: relative;
      }

      .choice input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .choice span {
        display: block;
        min-height: 44px;
        padding: 0.65rem 0.8rem;
        border: 1px solid #344463;
        border-radius: 0.75rem;
        background: rgb(17 26 46 / 85%);
        color: #dfeaf8;
        line-height: 1.35;
        cursor: pointer;
      }

      .choice input:checked + span {
        border-color: var(--pink);
        background: rgb(255 80 216 / 10%);
        color: var(--text);
      }

      .choice.correct span {
        border-color: #75f05c;
        background: rgb(117 240 92 / 12%);
      }

      .choice.wrong span {
        border-color: #ff6d7f;
        background: rgb(255 109 127 / 12%);
      }

      .answer-feedback {
        margin: 0.65rem 0 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .answer-feedback.correct { color: #75f05c; }
      .answer-feedback.wrong { color: #ff98a3; }

      .test-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 1rem;
      }

      .result-card {
        margin-top: 1rem;
        padding: 1.2rem;
        border-radius: 1.25rem;
        text-align: center;
      }

      .score {
        margin: 0;
        color: var(--lime);
        font-size: clamp(2.4rem, 8vw, 4.5rem);
        font-weight: 900;
        text-shadow: 0 0 22px rgb(215 255 112 / 24%);
      }

      .score-copy {
        margin: 0.35rem 0 0;
        color: #b7c5df;
      }

      .message {
        margin: 1rem 0 0;
        color: #ff9ee9;
        text-align: center;
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 1rem, 940px);
          padding: 0.8rem 0 1.25rem;
        }

        .intro { padding: 1.25rem 0 0.9rem; }

        h1 {
          font-size: clamp(2.1rem, 10vw, 3rem);
        }

        .subtitle {
          margin-top: 0.55rem;
          font-size: 0.92rem;
        }

        .controls {
          grid-template-columns: 1fr;
          gap: 0.55rem;
          padding: 0.65rem;
        }

        .topic-filter {
          width: 100%;
          align-items: flex-start;
          flex-direction: column;
        }

        .topic-options { width: 100%; }
        .topic-chip span { padding: 0.5rem 0.65rem; }

        .control-footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.55rem;
        }

        .test-card,
        .result-card { padding: 0.75rem; }

        .question-block { padding: 0.8rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topline">
        <span class="year-tag">YEAR 7</span>
        <a class="back-link" href="./index.html">← Flashcards</a>
      </header>

      <section class="intro" aria-labelledby="test-title">
        <p class="eyebrow">Ten questions. One science win.</p>
        <h1 id="test-title">Take the <span>test</span></h1>
        <p class="subtitle">Choose your topics, start a random test, and submit all your answers for a final score.</p>
      </section>

      <section class="controls" aria-label="Test topic controls">
        <div class="topic-filter">
          <span class="filter-label">Topics</span>
          <div id="topic-options" class="topic-options" aria-label="Choose test topics"></div>
        </div>
        <div class="topic-actions" aria-label="Topic selection controls">
          <button id="all-topics" class="topic-action" type="button" disabled>All</button>
          <button id="none-topics" class="topic-action" type="button" disabled>None</button>
        </div>
        <div class="control-footer">
          <span id="test-status" aria-live="polite">Loading topics…</span>
          <button id="start-button" class="button" type="button" disabled>Start test</button>
        </div>
      </section>

      <section id="test-card" class="test-card" aria-label="Test questions" hidden>
        <form id="test-form">
          <div id="question-list" class="question-list"></div>
          <div class="test-actions">
            <button id="submit-button" class="button" type="submit">Submit answers</button>
            <button id="restart-button" class="button button-secondary" type="button">New random test</button>
          </div>
        </form>
      </section>

      <section id="result-card" class="result-card" aria-live="polite" hidden>
        <p id="score" class="score">0 / 10</p>
        <p id="score-copy" class="score-copy"></p>
      </section>

      <p id="error-message" class="message" role="alert" hidden></p>
    </main>

    <script>
      const topicOptions = document.querySelector("#topic-options");
      const allTopicsButton = document.querySelector("#all-topics");
      const noneTopicsButton = document.querySelector("#none-topics");
      const startButton = document.querySelector("#start-button");
      const testStatus = document.querySelector("#test-status");
      const testCard = document.querySelector("#test-card");
      const testForm = document.querySelector("#test-form");
      const questionList = document.querySelector("#question-list");
      const submitButton = document.querySelector("#submit-button");
      const restartButton = document.querySelector("#restart-button");
      const resultCard = document.querySelector("#result-card");
      const scoreElement = document.querySelector("#score");
      const scoreCopy = document.querySelector("#score-copy");
      const errorMessage = document.querySelector("#error-message");

      let questions = [];
      let testQuestions = [];
      const selectedTopics = new Set();

      function shuffle(items) {
        const shuffled = [...items];
        for (let index = shuffled.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[swapIndex]] =
            [shuffled[swapIndex], shuffled[index]];
        }
        return shuffled;
      }

      function eligibleQuestions() {
        return questions.filter((item) => selectedTopics.has(item.topic));
      }

      function updateTopicControls() {
        const eligibleCount = eligibleQuestions().length;
        if (eligibleCount === 0) {
          testStatus.textContent = "Select at least one topic";
          startButton.disabled = true;
        } else {
          const testSize = Math.min(10, eligibleCount);
          testStatus.textContent =
            `${eligibleCount} cards eligible · ${testSize}-question test`;
          startButton.disabled = false;
        }
      }

      function createChoices(question) {
        return shuffle([question.answer, question.distractor]);
      }

      function renderTest() {
        questionList.replaceChildren();
        resultCard.hidden = true;
        submitButton.disabled = false;

        testQuestions.forEach((question, index) => {
          const fieldset = document.createElement("fieldset");
          fieldset.className = "question-block";
          fieldset.dataset.questionIndex = String(index);

          const legend = document.createElement("legend");
          const topic = document.createElement("span");
          topic.className = "question-topic";
          topic.textContent = question.topic;
          legend.append(topic, document.createTextNode(question.question));

          const choices = document.createElement("div");
          choices.className = "choices";

          createChoices(question).forEach((choiceText) => {
            const label = document.createElement("label");
            label.className = "choice";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `question-${index}`;
            radio.value = choiceText;

            const text = document.createElement("span");
            text.textContent = choiceText;
            label.append(radio, text);
            choices.append(label);
          });

          const feedback = document.createElement("p");
          feedback.className = "answer-feedback";
          feedback.hidden = true;

          fieldset.append(legend, choices, feedback);
          questionList.append(fieldset);
        });

        testCard.hidden = false;
        testStatus.textContent =
          `${testQuestions.length} questions ready · 0 answered`;
      }

      function startTest() {
        const eligible = eligibleQuestions();
        if (eligible.length === 0) return;
        testQuestions = shuffle(eligible).slice(0, Math.min(10, eligible.length));
        renderTest();
        testCard.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      questionList.addEventListener("change", () => {
        const answered = testQuestions.reduce((total, _question, index) =>
          total + (testForm.querySelector(`input[name="question-${index}"]:checked`) ? 1 : 0), 0);
        testStatus.textContent =
          `${testQuestions.length} questions ready · ${answered} answered`;
      });

      testForm.addEventListener("submit", (event) => {
        event.preventDefault();
        let score = 0;

        testQuestions.forEach((question, index) => {
          const selected = testForm.querySelector(
            `input[name="question-${index}"]:checked`
          );
          const fieldset = questionList.querySelector(
            `[data-question-index="${index}"]`
          );
          const labels = [...fieldset.querySelectorAll(".choice")];
          const feedback = fieldset.querySelector(".answer-feedback");

          labels.forEach((label) => {
            const radio = label.querySelector("input");
            radio.disabled = true;
            if (radio.value === question.answer) {
              label.classList.add("correct");
            } else if (selected && radio === selected) {
              label.classList.add("wrong");
            }
          });

          if (selected && selected.value === question.answer) {
            score += 1;
            feedback.textContent = "Correct";
            feedback.className = "answer-feedback correct";
          } else {
            feedback.textContent = `Answer: ${question.answer}`;
            feedback.className = "answer-feedback wrong";
          }
          feedback.hidden = false;
        });

        submitButton.disabled = true;
        scoreElement.textContent = `${score} / ${testQuestions.length}`;
        const percentage = Math.round((score / testQuestions.length) * 100);
        scoreCopy.textContent =
          percentage >= 80
            ? `Excellent — ${percentage}%`
            : percentage >= 50
              ? `Good effort — ${percentage}%`
              : `Keep practising — ${percentage}%`;
        resultCard.hidden = false;
        resultCard.scrollIntoView({ behavior: "smooth", block: "center" });
      });

      async function loadQuestions() {
        try {
          const response = await fetch("./questions.json");
          if (!response.ok) {
            throw new Error(`The question bank could not be loaded (${response.status}).`);
          }

          const data = await response.json();
          if (!Array.isArray(data) || data.length === 0 || data.some((item) =>
            !item || typeof item.topic !== "string" ||
            typeof item.question !== "string" || typeof item.answer !== "string" ||
            typeof item.distractor !== "string" || !item.distractor.trim() ||
            item.distractor.trim().toLowerCase() === item.answer.trim().toLowerCase()
          )) {
            throw new Error("The question bank is empty or has an invalid format.");
          }

          questions = data;
          const topics = [...new Set(questions.map((item) => item.topic))].sort();
          topicOptions.replaceChildren();
          topics.forEach((topic) => {
            const label = document.createElement("label");
            label.className = "topic-chip";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = topic;
            checkbox.checked = true;
            checkbox.addEventListener("change", () => {
              if (checkbox.checked) selectedTopics.add(topic);
              else selectedTopics.delete(topic);
              updateTopicControls();
            });

            const text = document.createElement("span");
            text.textContent = topic;
            label.append(checkbox, text);
            topicOptions.append(label);
            selectedTopics.add(topic);
          });

          allTopicsButton.disabled = false;
          noneTopicsButton.disabled = false;
          updateTopicControls();
        } catch (error) {
          testStatus.textContent = "Test unavailable";
          errorMessage.textContent = error.message;
          errorMessage.hidden = false;
        }
      }

      allTopicsButton.addEventListener("click", () => {
        topicOptions.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
          checkbox.checked = true;
          selectedTopics.add(checkbox.value);
        });
        updateTopicControls();
      });

      noneTopicsButton.addEventListener("click", () => {
        topicOptions.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
          checkbox.checked = false;
        });
        selectedTopics.clear();
        updateTopicControls();
      });

      startButton.addEventListener("click", startTest);
      restartButton.addEventListener("click", startTest);

      loadQuestions();
    </script>
  </body>
</html>
